<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IEEE VIT Student Election</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>IEEE VIT Student Election Portal</h1>
    <p>Vote for Chairman and panel roles — Velammal Institute of Technology</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Voter Verification</h2>
      <form id="voter-form" class="form-grid">
        <label>
          Full Name
          <input type="text" id="name" required placeholder="Enter your name" />
        </label>

        <label>
          Register Number
          <input type="text" id="regNo" required placeholder="e.g. 23CSE102" />
        </label>

        <label>
          IEEE Member ID
          <input type="text" id="memberId" required placeholder="IEEE Membership ID" />
        </label>

        <button type="submit">Start Voting</button>
      </form>
      <p id="voter-message" class="message"></p>
    </section>

    <section id="ballot-section" class="card hidden">
      <h2>Ballot</h2>
      <form id="ballot-form">
        <div id="roles-container"></div>
        <button type="submit" class="vote-btn">Submit Vote</button>
      </form>
      <p id="ballot-message" class="message"></p>
    </section>

    <section class="card">
      <h2>Election Dashboard</h2>
      <p class="sub">Visible for demo/admin use on this prototype.</p>
      <button id="show-results">View Live Results</button>
      <button id="reset-results" class="danger">Reset Election Data</button>
      <div id="results" class="results"></div>
    </section>
  </main>

  <footer>
    <small>Built for IEEE student chapter election process.</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
